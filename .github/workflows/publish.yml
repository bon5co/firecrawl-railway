name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            image: ghcr.io/bon5co/firecrawl-railway
            tag: 2.11.209
          - context: playwright
            image: ghcr.io/bon5co/firecrawl-railway-playwright
            tag: "2026.08.22"
          - context: rabbitmq
            image: ghcr.io/bon5co/firecrawl-railway-rabbitmq
            tag: 4.1.4
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.tag }}
            ${{ matrix.image }}:latest
